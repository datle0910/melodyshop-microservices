server:
  port: 8093

spring:
  application:
    name: ai-service

gemini:
  api-key: ${GEMINI_API_KEY:your-gemini-api-key}
  model: gemini-2.0-flash
  max-output-tokens: 2048
  temperature: 0.7
  base-url: https://generativelanguage.googleapis.com

# Ollama configuration (LangChain4j standard prefix)
langchain4j:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_MODEL:llama3.2}
    temperature: ${OLLAMA_TEMPERATURE:0.7}
    timeout: ${OLLAMA_TIMEOUT:120}s

# Custom properties
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}
  temperature: ${OLLAMA_TEMPERATURE:0.7}
  timeout: ${OLLAMA_TIMEOUT:120}

# Provider: "ollama" (local, free) or "gemini" (cloud, needs API key)
ai:
  provider: ${AI_PROVIDER:ollama}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.melodyshop.ai: DEBUG
