server:
  port: 8093

spring:
  application:
    name: ai-service
  config:
    import: optional:file:./config

gemini:
  api-key: ${GEMINI_API_KEY:your-gemini-api-key}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
  temperature: ${GEMINI_TEMPERATURE:0.7}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.melodyshop.ai: INFO
