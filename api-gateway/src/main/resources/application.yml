server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # --- Auth Service ---
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # --- User Service ---
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # --- Payment Service ---
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        # --- Customer Engagement Service: Review write ---
        - id: customer-engagement-review-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/reviews/**

        # --- Customer Engagement Service: Review read by product ---
        - id: customer-engagement-product-review-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/products/*/reviews

        # --- Customer Engagement Service: Wishlist ---
        - id: customer-engagement-wishlist-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/wishlist/**

        # --- Customer Engagement Service: Internal event simulation and docs ---
        - id: customer-engagement-internal-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/engagement/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

jwt:
  secret: ${JWT_SECRET:bWVsb2R5c2hvcC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNC12ZXJ5LWxvbmctc2VjcmV0}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
