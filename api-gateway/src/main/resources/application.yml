server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # --- Auth Service ---
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # --- User Service ---
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # --- Order Service ---
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/admin/orders/**

        # --- Cart Service ---
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**

        # --- Customer Engagement Service: Review read by product ---
        # Must be before product-service because it is more specific
        - id: customer-engagement-product-review-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/products/*/reviews

        # --- Customer Engagement Service: Review write ---
        - id: customer-engagement-review-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/reviews/**

        # --- Customer Engagement Service: Admin review management ---
        - id: customer-engagement-admin-review-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/admin/reviews/**

        # --- Customer Engagement Service: Wishlist ---
        - id: customer-engagement-wishlist-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/wishlist/**

        # --- Customer Engagement Service: Internal event simulation and docs ---
        - id: customer-engagement-internal-service
          uri: lb://customer-engagement-service
          predicates:
            - Path=/api/engagement/**

        # --- Payment Service ---
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        # --- Product Service ---
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**

        # --- Inventory Service ---
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**,/api/admin/inventory/**

        # --- Search Service ---
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**

        # --- Media Service ---
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**

        # --- Notification Service (internal only) ---
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # --- AI Service ---
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_YOUR_SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
