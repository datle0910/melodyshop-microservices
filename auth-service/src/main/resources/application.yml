server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/${AUTH_DB_NAME:auth_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_YOUR_SECRET_KEY}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Admin auto-init configuration
admin:
  email: ${ADMIN_EMAIL:admin@melodyshop.com}
  password: ${ADMIN_PASSWORD:admin123}
  full-name: ${ADMIN_FULL_NAME:Administrator}
  enabled: ${ADMIN_ENABLED:true}

# Face recognition service URL
face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8093}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
  swagger-ui:
    path: /api/auth/swagger-ui.html
