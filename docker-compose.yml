version: '3.8'

services:
  # ==================== DATABASES ====================
  auth-db:
    image: mariadb:10.11
    container_name: melodyshop-auth-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${AUTH_DB_NAME:-auth_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: mariadb:10.11
    container_name: melodyshop-user-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${USER_DB_NAME:-user_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3310:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: mariadb:10.11
    container_name: melodyshop-product-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${PRODUCT_DB_NAME:-product_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: mariadb:10.11
    container_name: melodyshop-inventory-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${INVENTORY_DB_NAME:-inventory_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3309:3306"
    volumes:
      - inventory-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: melodyshop-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== INFRASTRUCTURE ====================
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: melodyshop-eureka
    ports:
      - "8761:8761"
    networks:
      - backend-network
    environment:
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: melodyshop-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET:-bWVsb2R5c2hvcC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNC12ZXJ5LWxvbmctc2VjcmV0}
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  # ==================== BUSINESS SERVICES ====================
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: melodyshop-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET:-bWVsb2R5c2hvcC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNC12ZXJ5LWxvbmctc2VjcmV0}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: melodyshop-user
    ports:
      - "8084:8084"
    environment:
      DB_HOST: user-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: melodyshop-notification
    ports:
      - "8085:8085"
    environment:
      EUREKA_HOST: eureka-server
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-your-app-password}
      SPRING_PROFILES_ACTIVE: dev
      # ELK (optional — only active when stack is started with docker-compose.elk.yml)
      LOGSTASH_HOST: ${LOGSTASH_HOST:-}
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  media-service:
    build:
      context: .
      dockerfile: ./media-service/Dockerfile
    container_name: melodyshop-media
    ports:
      - "8087:8087"
    environment:
      EUREKA_HOST: eureka-server
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your-cloud-name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your-api-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your-api-secret}
      SPRING_PROFILES_ACTIVE: dev
      LOGSTASH_HOST: ${LOGSTASH_HOST:-}
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  # ==================== PRODUCT & INVENTORY & SEARCH ====================
  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    container_name: melodyshop-product
    ports:
      - "8082:8082"
    environment:
      DB_HOST: product-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME:-product_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      product-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  inventory-service:
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    container_name: melodyshop-inventory
    ports:
      - "8086:8086"
    environment:
      DB_HOST: inventory-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      inventory-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  search-service:
    build:
      context: .
      dockerfile: ./search-service/Dockerfile
    container_name: melodyshop-search
    ports:
      - "8088:8088"
    environment:
      EUREKA_HOST: eureka-server
      ELASTICSEARCH_URI: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network

  order-db:
    image: mariadb:10.11
    container_name: melodyshop-order-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${ORDER_DB_NAME:-order_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3311:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: melodyshop-order
    ports:
      - "8083:8083"
    environment:
      DB_HOST: order-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      order-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
# ==================== NETWORKS & VOLUMES ====================
networks:
  backend-network:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  product-db-data:
  inventory-db-data:
  order-db-data:
  elasticsearch-data:
