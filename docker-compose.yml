version: '3.8'

services:
  # ==================== DATABASES ====================
  auth-db:
    image: mariadb:10.11
    container_name: melodyshop-auth-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${AUTH_DB_NAME:-auth_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: mariadb:10.11
    container_name: melodyshop-user-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${USER_DB_NAME:-user_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3310:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: mariadb:10.11
    container_name: melodyshop-payment-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${PAYMENT_DB_NAME:-payment_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3311:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: mariadb:10.11
    container_name: melodyshop-product-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${PRODUCT_DB_NAME:-product_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: mariadb:10.11
    container_name: melodyshop-inventory-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${INVENTORY_DB_NAME:-inventory_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3309:3306"
    volumes:
      - inventory-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: mariadb:10.11
    container_name: melodyshop-order-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${ORDER_DB_NAME:-order_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3312:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  cart-db:
    image: mariadb:10.11
    container_name: melodyshop-cart-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_secret_2024}
      MARIADB_DATABASE: ${CART_DB_NAME:-cart_db}
      MARIADB_USER: ${DB_USERNAME:-melodyshop}
      MARIADB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
    ports:
      - "3313:3306"
    volumes:
      - cart-db-data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: melodyshop-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== INFRASTRUCTURE ====================
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: melodyshop-eureka
    ports:
      - "8761:8761"
    networks:
      - backend-network
    environment:
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: melodyshop-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== BUSINESS SERVICES ====================
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: melodyshop-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      EUREKA_HOST: eureka-server
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@melodyshop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      FACE_SERVICE_URL: http://face-service:8093
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      face-service:
        condition: service_started
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: melodyshop-user
    ports:
      - "8084:8084"
    environment:
      DB_HOST: user-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: melodyshop-notification
    ports:
      - "8085:8085"
    environment:
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
      LOGSTASH_HOST: ${LOGSTASH_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      no_proxy: "smtp.gmail.com,localhost,127.0.0.1"
      NO_PROXY: "smtp.gmail.com,localhost,127.0.0.1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-service:
    build:
      context: .
      dockerfile: ./media-service/Dockerfile
    container_name: melodyshop-media
    ports:
      - "8089:8094"
    environment:
      EUREKA_HOST: eureka-server
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your-cloud-name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your-api-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your-api-secret}
      SPRING_PROFILES_ACTIVE: dev
      LOGSTASH_HOST: ${LOGSTASH_HOST:-}
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8094/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./img-product:/app/img-product

  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    container_name: melodyshop-product
    ports:
      - "8082:8082"
    environment:
      DB_HOST: product-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME:-product_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      product-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: melodyshop-payment
    ports:
      - "8087:8087"
    environment:
      DB_HOST: payment-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-payment_webhook_secret}
      PAYMENT_GATEWAY_REDIRECT_BASE_URL: ${PAYMENT_GATEWAY_REDIRECT_BASE_URL:-http://fake-gateway/pay}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYMENT_INTERNAL_SERVICE_TOKEN: ${PAYMENT_INTERNAL_SERVICE_TOKEN:-melodyshop-payment-internal-dev}
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-VCB}
      VIETQR_BANK_NAME: ${VIETQR_BANK_NAME:-Vietcombank}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-0123456789}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-MELODYSHOP}
      VIETQR_QR_BASE_URL: ${VIETQR_QR_BASE_URL:-https://qr.sepay.vn/img}
      VIETQR_PAYMENT_EXPIRE_MINUTES: ${VIETQR_PAYMENT_EXPIRE_MINUTES:-30}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      payment-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    container_name: melodyshop-inventory
    ports:
      - "8086:8086"
    environment:
      DB_HOST: inventory-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      inventory-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  cart-service:
    build:
      context: .
      dockerfile: ./cart-service/Dockerfile
    container_name: melodyshop-cart
    ports:
      - "8091:8096"
    environment:
      DB_HOST: cart-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      CART_DB_NAME: ${CART_DB_NAME:-cart_db}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      cart-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8096/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: melodyshop-order
    ports:
      - "8092:8083"
    environment:
      DB_HOST: order-db
      DB_USERNAME: ${DB_USERNAME:-melodyshop}
      DB_PASSWORD: ${DB_PASSWORD:-melodyshop_secret_2024}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      PAYMENT_INTERNAL_SERVICE_TOKEN: ${PAYMENT_INTERNAL_SERVICE_TOKEN:-melodyshop-payment-internal-dev}
      EUREKA_HOST: eureka-server
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-engagement-service:
    build:
      context: .
      dockerfile: ./customer-engagement-service/Dockerfile
    container_name: melodyshop-customer-engagement
    ports:
      - "8088:8095"
    environment:
      EUREKA_HOST: eureka-server
      ENGAGEMENT_REVIEW_ASSUME_PURCHASED: ${ENGAGEMENT_REVIEW_ASSUME_PURCHASED:-true}
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8095/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  search-service:
    build:
      context: .
      dockerfile: ./search-service/Dockerfile
    container_name: melodyshop-search
    ports:
      - "8090:8088"
    environment:
      EUREKA_HOST: eureka-server
      ELASTICSEARCH_URI: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    container_name: melodyshop-ai
    ports:
      - "8093:8093"
    environment:
      EUREKA_HOST: eureka-server
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.7}
      SPRING_PROFILES_ACTIVE: dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  face-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.face
    container_name: melodyshop-face
    ports:
      - "8097:8093"
    environment:
      PORT: 8093
      HOST: 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8093/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== NETWORKS & VOLUMES ====================
networks:
  backend-network:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  payment-db-data:
  product-db-data:
  inventory-db-data:
  order-db-data:
  cart-db-data:
  elasticsearch-data:
