input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse the JSON log from logstash-logback-encoder
  if [message] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # Add a readable timestamp
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Enrich: add environment tag
  mutate {
    add_field => {
      "environment"   => "development"
      "project"       => "melodyshop"
    }
    # Remove noisy fields
    remove_field => ["host", "port"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "melodyshop-logs-%{[service_name]:unknown}-%{+YYYY.MM.dd}"
    # Creates a separate index per service per day, e.g.:
    #   melodyshop-logs-auth-service-2024.01.08
    #   melodyshop-logs-order-service-2024.01.08
  }

  # Also print to Logstash stdout for debugging
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
