<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã OTP xác thực</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .wrapper { max-width: 560px; margin: 30px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #6B46C1, #4F46E5); padding: 32px 30px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 24px; }
        .content { padding: 36px 30px; text-align: center; }
        .content p { color: #555; line-height: 1.7; font-size: 15px; margin: 0 0 16px; }
        .otp-box { display: inline-block; background: #f3f0ff; border: 2px dashed #6B46C1; border-radius: 12px; padding: 20px 40px; margin: 24px 0; }
        .otp-code { font-size: 48px; font-weight: 800; color: #4F46E5; letter-spacing: 10px; margin: 0; }
        .expiry { background: #fff8e1; border-left: 4px solid #FFC107; padding: 12px 20px; border-radius: 0 8px 8px 0; text-align: left; margin-top: 20px; font-size: 14px; color: #666; }
        .warning { color: #e53e3e; font-size: 13px; margin-top: 20px; }
        .footer { background: #f8f7ff; padding: 20px 30px; text-align: center; color: #888; font-size: 13px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>🎵 MelodyShop — Xác thực OTP</h1>
    </div>
    <div class="content">
        <p>Xin chào, <strong th:text="${recipientName}">Khách hàng</strong>!</p>
        <p>Mã OTP của bạn là:</p>

        <div class="otp-box">
            <p class="otp-code" th:text="${otp}">000000</p>
        </div>

        <div class="expiry">
            ⏱ Mã này có hiệu lực trong <strong th:text="${expiryMinutes}">5</strong> phút.
        </div>

        <p class="warning">⚠️ Không chia sẻ mã OTP này với bất kỳ ai, kể cả nhân viên MelodyShop.</p>
    </div>
    <div class="footer">
        <p>Nếu bạn không yêu cầu mã này, hãy bỏ qua email này.</p>
        <p>© 2024 MelodyShop — <strong>support@melodyshop.vn</strong></p>
    </div>
</div>
</body>
</html>
