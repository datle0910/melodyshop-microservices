server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/${PAYMENT_DB_NAME:payment_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

payment:
  gateway:
    redirect-base-url: ${PAYMENT_GATEWAY_REDIRECT_BASE_URL:http://fake-gateway/pay}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:payment_webhook_secret}
  outbox:
    publisher:
      fixed-delay-ms: ${PAYMENT_OUTBOX_PUBLISHER_DELAY_MS:3000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/payments/v3/api-docs
  swagger-ui:
    path: /api/payments/swagger-ui.html
