server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/${PAYMENT_DB_NAME:payment_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

payment:
  gateway:
    redirect-base-url: ${PAYMENT_GATEWAY_REDIRECT_BASE_URL:http://fake-gateway/pay}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:payment_webhook_secret}
  outbox:
    publisher:
      fixed-delay-ms: ${PAYMENT_OUTBOX_PUBLISHER_DELAY_MS:3000}

vnpay:
  merchant-code: ${VNPAY_MERCHANT_CODE:TEST_MERCHANT}
  secret-key: ${VNPAY_SECRET_KEY:TEST_SECRET_KEY}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/checkout}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/apis/vnpay}

momo:
  partner-code: ${MOMO_PARTNER_CODE:MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY}
  return-url: ${MOMO_RETURN_URL:http://localhost:5173/checkout}
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_testkey}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/checkout?payment=success&orderId={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/checkout?payment=failed}

vietqr:
  bank-code: ${VIETQR_BANK_CODE:VCB}
  bank-name: ${VIETQR_BANK_NAME:Vietcombank}
  account-number: ${VIETQR_ACCOUNT_NUMBER:0123456789}
  account-name: ${VIETQR_ACCOUNT_NAME:MELODYSHOP}
  qr-base-url: ${VIETQR_QR_BASE_URL:https://qr.sepay.vn/img}
  payment-expire-minutes: ${VIETQR_PAYMENT_EXPIRE_MINUTES:30}

internal:
  service-token: ${PAYMENT_INTERNAL_SERVICE_TOKEN:melodyshop-payment-internal-dev}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/payments/v3/api-docs
  swagger-ui:
    path: /api/payments/swagger-ui.html
